*{box-sizing:inherit}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 'Libre Franklin',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 40px}
h1,h2{font-family:'Libre Caslon Text',Georgia,serif;margin:0}
h1{font-size:1.9rem}h2{font-size:1.35rem}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.score{text-align:right;font-family:'Libre Caslon Text',Georgia,serif;font-size:2.4rem;line-height:1}
.score small{display:block;font:600 .8rem 'Libre Franklin',sans-serif;color:var(--mut)}
.neg{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.strip{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;margin-bottom:14px}
.strip div{text-align:center;font-size:.72rem;padding:3px 0;border:1px solid var(--line);background:var(--card);border-radius:2px;min-height:34px}
.strip b{display:block;color:var(--mut);font-weight:400}
.strip .cur{border-color:var(--grn);outline:2px solid var(--grn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:12px 0}
.grid span{display:block;color:var(--mut);font-size:.82rem}
.grid .w{grid-column:1/-1}
.bags{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.bags .opt{margin-top:0}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.88rem}.bar i{display:block;height:12px;border-radius:3px;min-width:2px;border:1px solid var(--line)}.bar b{width:46px;text-align:right}.bar em{font-style:normal;width:140px}.nud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}.nud button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;padding:6px 12px;font:inherit;cursor:pointer}
ul{margin:6px 0 0;padding-left:20px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--grn);border-radius:4px;padding:11px 13px;margin-top:9px;font:inherit;cursor:pointer}
.opt:hover{background:var(--bg)}.opt:focus-visible,input:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt b{display:block}.opt small{color:var(--mut);font-size:.9rem}
.cu{display:flex;gap:8px;margin-top:9px}
input{flex:1;min-width:0;font:inherit;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.go{background:var(--grn);color:var(--card);border:0;border-radius:4px;padding:10px 18px;font:600 1rem 'Libre Franklin',sans-serif;cursor:pointer}
.res{border-left:5px solid var(--gold)}
.res p{margin:.3em 0}
.sum{font-weight:600;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:10px}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:center}
@media(max-width:560px){.strip{grid-template-columns:repeat(9,1fr)}}
@media(prefers-reduced-motion:no-preference){.res{animation:in .4s}@keyframes in{from{opacity:0}to{opacity:1}}}

const STORE={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SK={pro:{n:'Tour Pro',mu:.16,t:'about +3 a round'},low:{n:'Low handicap',mu:.42,t:'about +8'},mid:{n:'Mid handicap',mu:.72,t:'about +13'},high:{n:'High handicap',mu:1.05,t:'about +19'}};
const FN=['A. Reyes','T. Okafor','L. Brandt','M. Ishida','J. Calloway','S. Navarro','D. Whitfield','K. Ahn','R. Duarte','P. Lindqvist','C. Mbeki','E. Rourke','H. Tanaka','B. Castellanos','N. Petrov','G. Fairweather','V. Ortega','W. Haddad','F. Moretti','I. Sorensen','O. Banerjee','Z. Kowalski','U. Delacroix','Y. Park','X. Hendricks','Q. Valdez','T. Brennan','M. Okonkwo','R. Salazar'];
const t2=p=>p.r.reduce((a,b)=>a+b,0);
function newTourney(){const base=9*(C.dm||1);TRN={c:C.id,round:1,done:false,cut:null,me:{r:[],out:false},f:FN.map((n,i)=>({n,mu:base*(.3+i/28),r:[],out:false}))}}
function tourRound(){TRN.me.r.push(S.tot);TRN.f.forEach(p=>{if(!p.out)p.r.push(rn(p.mu+g()*3.2))});
 if(TRN.round==2){const all=[...TRN.f.map(t2),t2(TRN.me)].sort((a,b)=>a-b),line=all[14];TRN.cut=line;TRN.f.forEach(p=>{if(t2(p)>line)p.out=true});if(t2(TRN.me)>line){TRN.me.out=true;TRN.done=true}}
 if(TRN.round==4)TRN.done=true}
function board(){const rows=[...TRN.f.map(p=>({n:p.n,r:p.r,out:p.out})),{n:'You',r:TRN.me.r,out:TRN.me.out,me:1}];rows.forEach(p=>p.t=t2(p));
 rows.sort((a,b)=>(a.out-b.out)||(a.t-b.t));let pos=0;rows.forEach((p,i)=>{if(i==0||rows[i-1].t!=p.t||rows[i-1].out!=p.out)pos=i+1;p.pos=pos});
 rows.forEach(p=>p.tie=rows.filter(q=>q.pos==p.pos&&q.out==p.out).length>1);return rows}
const myPos=()=>{const m=board().find(p=>p.me);return m.out?'CUT':(m.tie?'T':'')+m.pos};
function boardHtml(){const rows=board(),show=rows.filter((p,i)=>i<10||p.me);
 return '<table><tr><th>Pos</th><th>Player</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th><th>Total</th></tr>'+show.map(p=>`<tr style="${p.me?'font-weight:600;background:var(--bg)':''}"><td>${p.out?'CUT':(p.tie?'T':'')+p.pos}</td><td>${p.n}</td>${[0,1,2,3].map(i=>`<td>${p.r[i]!=null?sc(p.r[i]):''}</td>`).join('')}<td>${sc(p.t)}</td></tr>`).join('')+'</table>'}
const matchText=()=>{const u=MT.up,n=MT.c.length;return (u>0?'You are '+u+' UP':u<0?'You are '+(-u)+' DOWN':'All square')+' through '+n};
function matchResult(){const n=MT.c.length,u=MT.up,left=18-n;return n==18?(u>0?'You win '+u+' UP':u<0?'You lose '+(-u)+' DOWN':'The match is halved'):(u>0?'You win ':'You lose ')+Math.abs(u)+'&'+left}
function endRound(){const hs=S.hs,n=S.card.length;
 if(n==18){const all=STORE.get('golfStats')||[];all.push({t:Date.now(),c:C.id,cn:C.name,b:B.id,bn:B.n,mode:MODE,tot:S.tot,putts:hs.reduce((a,h)=>a+h.p,0),gir:hs.filter(h=>h.gir).length,pen:hs.reduce((a,h)=>a+h.pen,0)});STORE.set('golfStats',all.slice(-200))}
 STORE.del('golfSave');if(MODE=='tour'&&TRN)tourRound()}
function hole(t){S.aim=null;const par=H[S.h][1],df=S.st-par,nm=S.st==1?'Hole in one!':({'-3':'Albatross','-2':'Eagle','-1':'Birdie','0':'Par','1':'Bogey','2':'Double bogey'}[df]||(df>0?'+'+df:df)),hn=S.h+1;
 S.hs.push({s:S.st,p:S.pt,fw:S.fw,gir:S.gst!=null&&S.gst<=par-2,pen:S.pen});S.card.push(S.st);S.tot+=df;let ms='';
 if(MODE=='match'&&MT){const cpu=Math.max(par-2,par+rn(SK[MT.skill].mu*LAY(S.h).hd+g()*.8)),r=S.st<cpu?1:S.st>cpu?-1:0;MT.c.push(cpu);MT.up+=r;ms=` ${r>0?'You win the hole':r<0?'The CPU wins the hole':'The hole is halved'} (CPU ${cpu}). ${matchText()}.`}
 S.last={t,sum:`Hole ${hn} complete: ${nm} (${S.st}) · Score: ${sc(S.tot)}.${ms}`};
 if(S.h==17||(MODE=='match'&&MT&&Math.abs(MT.up)>17-S.h)){S.over=true;endRound();render();return}
 S.h++;S.st=0;S.lie='tee';S.d=H[S.h][2];S.w=wind();nh();render()}
function saveGame(){if(S&&!S.over)STORE.set('golfSave',{c:C.id,b:B.id,S,MODE,TRN,MT})}
function resumeGame(){const d=STORE.get('golfSave');if(!d)return;C=COURSES.find(c=>c.id==d.c);H=C.h;COURSE=C.id;SEED=C.seed;LN.trees=C.tl;for(const k in LC)delete LC[k];B=BAGS.find(b=>b.id==d.b);S=d.S;MODE=d.MODE;TRN=d.TRN;MT=d.MT;render()}
function again(){if(MODE=='tour')newTourney();MT=MODE=='match'?{skill:SKILL,up:0,c:[]}:null;start()}
function nextRound(){TRN.round++;start()}
function clearStats(){STORE.del('golfStats');menu()}
function setMode(m){MODE=m;menu()}
function modeBanner(){if(MODE=='tour'&&TRN)return `<div style="font-weight:600;color:var(--grn)">Tournament: round ${TRN.round} of 4${TRN.round>1?' · you stand '+myPos():''}</div>`;if(MODE=='match'&&MT)return `<div style="font-weight:600;color:var(--grn)">Match vs ${SK[MT.skill].n}: ${MT.c.length?matchText():'all square'}</div>`;return ''}
function resumeHtml(){const d=STORE.get('golfSave');if(!d)return'';const c=COURSES.find(x=>x.id==d.c);if(!c)return'';return `<div class="card"><b>Resume your round</b><div style="color:var(--mut)">${c.name}, hole ${d.S.h+1}, ${sc(d.S.tot)}${d.MODE=='tour'?' (tournament)':d.MODE=='match'?' (match)':''}</div><button class="go" style="margin-top:8px" onclick="resumeGame()">Resume</button> <button class="go" style="margin-top:8px;background:var(--bg);color:var(--ink)" onclick="STORE.del('golfSave');menu()">Discard</button></div>`}
function modeHtml(){return '<h2>1. Game mode</h2><div class="bags">'+[['practice','Practice round','Play 18 holes at your own pace'],['tour','Tournament','4 rounds against a field of 29, with a cut after round 2'],['match','Match play vs CPU','An 18-hole match against a computer player']].map(m=>`<button class="opt" style="border-left-color:${MODE==m[0]?'var(--gold)':'var(--line)'}" onclick="setMode('${m[0]}')"><b>${m[1]}${MODE==m[0]?' (selected)':''}</b><small>${m[2]}</small></button>`).join('')+'</div>'+(MODE=='match'?`<div style="margin-top:10px"><label for="skill" style="font-size:.85rem;color:var(--mut)">CPU skill</label> <select id="skill" onchange="SKILL=this.value" style="font:inherit;padding:6px">${Object.entries(SK).map(([k,v])=>`<option value="${k}" ${SKILL==k?'selected':''}>${v.n} (${v.t})</option>`).join('')}</select></div>`:'')}
function statsHtml(){const a=STORE.get('golfStats')||[];if(!a.length)return'';const by={};a.forEach(r=>{(by[r.c]=by[r.c]||{n:r.cn,rs:[]}).rs.push(r)});
 const rows=Object.values(by).map(o=>{const t=o.rs.map(r=>r.tot);return `<tr><td>${o.n}</td><td>${o.rs.length}</td><td>${sc(Math.min(...t))}</td><td>${sc(rn(t.reduce((x,y)=>x+y,0)/t.length))}</td></tr>`}).join('');
 const last=a.slice(-5).reverse().map(r=>`<tr><td>${new Date(r.t).toLocaleDateString()}</td><td>${r.cn}</td><td>${r.bn}</td><td>${{tour:'Tournament',match:'Match'}[r.mode]||'Practice'}</td><td>${sc(r.tot)}</td><td>${r.putts}</td></tr>`).join('');
 return `<h2 style="margin-top:18px">Your records</h2><table><tr><th>Course</th><th>Rounds</th><th>Best</th><th>Average</th></tr>${rows}</table><h2 style="margin-top:14px">Last 5 rounds</h2><table><tr><th>Date</th><th>Course</th><th>Bag</th><th>Mode</th><th>Score</th><th>Putts</th></tr>${last}</table><p><button class="go" style="background:var(--bg);color:var(--ink)" onclick="clearStats()">Clear stats</button></p>`}
function summaryHtml(){const hs=S.hs,n=S.card.length,par=H.slice(0,n).reduce((a,x)=>a+x[1],0),str=S.card.reduce((a,b)=>a+b,0),df=S.card.map((x,i)=>x-H[i][1]),cnt=f=>df.filter(f).length,fwn=hs.filter(h=>h.fw!==null).length,fw=hs.filter(h=>h.fw).length,gir=hs.filter(h=>h.gir).length,pt=hs.reduce((a,h)=>a+h.p,0),pen=hs.reduce((a,h)=>a+h.pen,0);
 const nine=(a,b,lab)=>{const ix=[];for(let i=a;i<b&&i<n;i++)ix.push(i);if(!ix.length)return'';const sm=f=>ix.reduce((x,i)=>x+f(i),0);
  return `<table><tr><th>${lab}</th>${ix.map(i=>`<th>${i+1}</th>`).join('')}<th>Tot</th></tr><tr><td>Par</td>${ix.map(i=>`<td>${H[i][1]}</td>`).join('')}<td>${sm(i=>H[i][1])}</td></tr><tr><td>Score</td>${ix.map(i=>`<td style="font-weight:${df[i]<0?700:400};color:${df[i]<0?'var(--red)':'inherit'}">${S.card[i]}</td>`).join('')}<td>${sm(i=>S.card[i])}</td></tr><tr><td>Putts</td>${ix.map(i=>`<td>${hs[i].p}</td>`).join('')}<td>${sm(i=>hs[i].p)}</td></tr></table>`};
 const bi=df.indexOf(Math.min(...df)),wi=df.indexOf(Math.max(...df));
 let h=`<div class="card"><h2>${MODE=='match'?matchResult():'Round complete'}</h2><p>${str} strokes (${sc(S.tot)}) on ${C.name} with the ${B.n} bag.</p>${nine(0,9,'Out')}${nine(9,18,'In')}
 <div class="grid"><div><span>Birdies or better</span>${cnt(d=>d<0)}</div><div><span>Pars</span>${cnt(d=>d==0)}</div><div><span>Bogeys</span>${cnt(d=>d==1)}</div><div><span>Double bogey or worse</span>${cnt(d=>d>=2)}</div><div><span>Fairways hit</span>${fw} of ${fwn}</div><div><span>Greens in regulation</span>${gir} of ${n}</div><div><span>Putts</span>${pt} (${(pt/n).toFixed(1)} per hole)</div><div><span>Penalty strokes</span>${pen}</div><div><span>Best hole</span>Hole ${bi+1} (${sc(df[bi])})</div><div><span>Worst hole</span>Hole ${wi+1} (${sc(df[wi])})</div></div></div>`;
 if(MODE=='tour'&&TRN){h+=`<div class="card"><h2>Tournament leaderboard</h2>${boardHtml()}<p>`+(TRN.me.out?`You missed the cut (the line was ${sc(TRN.cut)}).`:TRN.done?`Tournament complete. You finished ${myPos()}.`:TRN.round==2?`You made the cut (line ${sc(TRN.cut)}). You stand ${myPos()}.`:`After round ${TRN.round} you stand ${myPos()}.`)+`</p>`+(TRN.done?'':`<button class="go" onclick="nextRound()">Start round ${TRN.round+1}</button> `)+`<button class="go" style="background:var(--bg);color:var(--ink)" onclick="menu()">Main menu</button></div>`}
 else h+=`<div class="card"><button class="go" onclick="again()">Play again</button> <button class="go" onclick="menu()">Change course</button></div>`;
 return h}
function pickOpt(i){if(aimable()&&CAD[i]){S.aim={...CAD[i].aim};const p=aimInfo();return shot(p.o,'Your caddie lines up the '+['aggressive','conservative','balanced'][i]+' target.')}shot(opts()[i])}
function custom(){const v=document.getElementById('cu').value.toLowerCase();if(!v.trim())return;
 const o=opts(),i=/aggress|pin|attack|go for|driver|firm/.test(v)?0:/safe|conserv|lay|lag|iron|wood|center|middle/.test(v)?1:2;
 if(aimable()&&CAD[i]){S.aim={...CAD[i].aim};const p=aimInfo();return shot(p.o,`You go with your own plan and it plays like the ${['aggressive','conservative','balanced'][i]} option.`)}
shot(o[i],`You go with your own plan ("${document.getElementById('cu').value.trim()}") and it plays like the ${o[i].l.toLowerCase()} option.`)}
function render(){const h=H[S.h],par=h[1],o=S.over?[]:opts(),e=eff(),ft=S.lie=='green';
 const tt=S.card.reduce((a,b)=>a+b,0);
 let html=`<div class="top"><div><h1>${C.name}</h1><div style="color:var(--mut)">${S.wx} · <a href="#" onclick="menu();return false" style="color:var(--grn)">Change course</a></div>${modeBanner()}</div><div class="score ${S.tot<0?'neg':''}">${sc(S.tot)}<small>Thru ${S.card.length}</small></div></div>
 <div class="strip">${H.map((x,i)=>`<div class="${i==S.h&&!S.over?'cur':''}"><b>${i+1}</b>${S.card[i]??'·'}</div>`).join('')}</div>`;
 if(S.last)html+=`<div class="card res"><h2>Shot result</h2><p>${S.last.t}</p><div class="sum ${S.last.sum.includes('-')&&/Birdie|Eagle|Albatross|one/.test(S.last.sum)?'neg':''}">${S.last.sum}</div></div>`;
 if(S.over){html+=summaryHtml()}
 else html+=`<div class="card"><h2>Hole ${S.h+1}: ${h[0]} · Par ${par} · ${h[2]} yds</h2>
 <div class="grid"><div><span>Ball location</span>${LN[S.lie]}</div><div><span>Stroke</span>${S.st+1}</div>
 <div><span>Distance to pin</span>${ft?S.ft+' ft':S.d+' yds'+(S.d>60?` (plays like ${rn(e)})`:'')}</div><div><span>Lie quality</span>${LQ[S.lie]}</div>
 <div><span>Wind</span>${S.w.sp} mph ${S.w.t}</div><div><span>Elevation</span>${h[3]==0?'Flat':Math.abs(h[3])+' ft '+(h[3]>0?'uphill':'downhill')+' overall'}</div>
 <div class="w"><span>Hazards ahead</span><ul>${ahead().map(s=>`<li>${s}</li>`).join('')}</ul><div style="color:var(--mut);font-size:.85rem;margin-top:6px">${h[4]}</div></div></div>
 ${map()}${aimable()?aimBlock():''}<strong style="display:block">${aimable()?'Hit preset shot':'Choose your shot'}</strong>${(aimable()?cadOpts():o).map((x,i)=>`<button class="opt" onclick="pickOpt(${i})"><b>Option ${'ABC'[i]}: ${x.l} – ${x.c}</b><small>${x.x}</small></button>`).join('')}
 <div class="cu"><input id="cu" placeholder="Option D: type your own strategy" aria-label="Custom strategy" onkeydown="if(event.key=='Enter')custom()"><button class="go" onclick="custom()">Play it</button></div></div>`;
 app.innerHTML=html;saveGame()}
menu();
</script></body></html>
